<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Notes for Dixie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@600;800&family=Noto+Sans+Georgian:wght@500;700;800&display=swap">
<style>
/* Layout: a notebook page; one taped note at a time in the middle, progress stamps above, then a space shooter with a boss on the last note. Single paper look by choice. */
:root {
  --page: #f3eefc;
  --grid: #ddd2f3;
  --ink: #2f2346;
  --ink-soft: #6d5f86;
  --note-a: #ffe27a;
  --note-b: #ffc2dc;
  --note-c: #b9ecd6;
  --note-d: #bfdcff;
  --yes: #ff5f9e;
  --hand: "Patrick Hand", "Noto Sans Georgian", "Comic Sans MS", cursive;
  --body: "Nunito", "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--body);
  background-color: var(--page);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.app {
  height: 100%; max-width: 520px; margin: 0 auto;
  display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
  padding-block: 18px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.to { font: 700 22px/1 var(--hand); }
.stamps { display: flex; gap: 6px; }
.stamp { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--ink-soft); transition: background .3s, border-color .3s, transform .3s; }
.stamp.on { background: var(--yes); border: 2px solid var(--ink); transform: scale(1.1); }

.desk { position: relative; display: grid; place-items: center; min-height: 0; }
.note {
  position: relative; width: min(100%, 420px);
  background: var(--c, var(--note-a)); border: 2.5px solid var(--ink); border-radius: 6px;
  box-shadow: 6px 7px 0 var(--ink);
  padding: 30px 22px 22px; display: grid; gap: 10px;
  transform: rotate(var(--tilt, -2deg));
  animation: arrive .55s cubic-bezier(.3,1.5,.5,1);
}
.note::before { content: ""; position: absolute; top: -14px; left: 50%; width: 92px; height: 26px; transform: translateX(-50%) rotate(3deg); background: rgba(255,255,255,.6); border: 1.5px solid rgba(47,35,70,.25); }
.note.leave { animation: leave .5s ease-in forwards; }
.note.shake { animation: shake .45s; }
@keyframes arrive { from { transform: translateY(60px) rotate(8deg) scale(.85); opacity: 0; } }
@keyframes leave { to { transform: translate(120%, -40px) rotate(25deg); opacity: 0; } }
@keyframes shake { 25% { transform: rotate(-4deg) translateX(-6px); } 50% { transform: rotate(2deg) translateX(6px); } 75% { transform: rotate(-3deg) translateX(-3px); } }
.num { font: 800 12px/1 var(--body); letter-spacing: .14em; color: var(--ink-soft); }
.q { margin: 0; font: 700 clamp(24px, 6.6vw, 31px)/1.3 var(--hand); text-wrap: balance; }
.choices { position: relative; height: 150px; }
.btn {
  position: absolute; top: 46px;
  font: 800 18px/1 var(--body); color: var(--ink);
  background: #fff; border: 2.5px solid var(--ink); border-radius: 14px;
  padding: 14px 24px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); white-space: nowrap;
  transition: left .3s cubic-bezier(.3,1.4,.5,1), top .3s cubic-bezier(.3,1.4,.5,1), transform .3s;
  touch-action: manipulation;
}
.btn:active { box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--yes); outline-offset: 3px; }
.btn.yes { background: var(--yes); color: #fff; z-index: 2; }
.btn.static { position: static; justify-self: center; }

/* game */
.note.game { padding: 26px 14px 14px; gap: 8px; }
.hud { display: flex; justify-content: space-between; gap: 10px; font: 800 15px/1 var(--body); padding-inline: 4px; font-variant-numeric: tabular-nums; }
.arena { position: relative; height: min(56vh, 460px); border: 2.5px solid var(--ink); border-radius: 10px; overflow: hidden; background: linear-gradient(#2c1f45, #4a2f62); touch-action: manipulation; cursor: pointer; }
.arena canvas { display: block; width: 100%; height: 100%; }
.over { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 18px; text-align: center; color: #fff; background: rgba(44,31,69,.8); cursor: default; }
.over h2 { margin: 0; font: 700 clamp(26px, 7vw, 34px)/1.2 var(--hand); }
.over p { margin: 0; font: 700 17px/1.45 var(--body); text-wrap: balance; }
.over[hidden] { display: none; }
.over .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.over .btn { position: static; }
.big { font: 800 48px/1 var(--body); color: var(--note-a); font-variant-numeric: tabular-nums; }

.foot { text-align: center; font: 700 16px/1.3 var(--hand); color: var(--ink-soft); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) { .note, .note.leave, .note.shake { animation: none; } .btn { transition: none; } }
</style>

<div class="app">
  <div class="top">
    <span class="to" id="to"></span>
    <div class="stamps" id="stamps" aria-label="Progress"><span class="stamp"></span><span class="stamp"></span><span class="stamp"></span></div>
  </div>
  <main class="desk" id="desk" aria-live="polite"></main>
  <div class="foot" id="foot"></div>
</div>
<canvas id="fx"></canvas>

// =====================================================================
//  EDIT THE WORDS HERE
// =====================================================================
const T = {
  to:        "დიქსის",
  intro:     "ცოტა გაერთე და შემირიგდი",
  startGame: "თამაშის დაწყება",
  ask:       "ეს ცოტას გამოისყიდის?",
  yes:       "კი",
  no:        "არა",
  thanks:    "მადლობა მოწყალებისთვის",
  later:     "არაუშავს, მერე კიდევ ვცდი",
};
// =====================================================================

const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const desk = $('desk');
$('to').textContent = T.to;
let relayout = null;

function stamp(i) { $('stamps').children[i].classList.add('on'); }
function clearStamps() { [...$('stamps').children].forEach(s => s.classList.remove('on')); }

function note(color, tilt) {
  const n = document.createElement('article');
  n.className = 'note';
  n.style.setProperty('--c', `var(${color})`);
  n.style.setProperty('--tilt', tilt + 'deg');
  return n;
}
function swapTo(build) {
  const old = desk.querySelector('.note');
  const go = () => { relayout = null; build(); };
  if (old && !REDUCED) { old.classList.add('leave'); setTimeout(go, 460); } else go();
}

// ---------- the opening pop-up ----------
function intro() {
  clearStamps();
  $('foot').textContent = '';
  const n = note('--note-b', -2);
  n.innerHTML = `<h1 class="q"></h1><button class="btn yes static" type="button"></button>`;
  n.querySelector('.q').textContent = T.intro;
  const b = n.querySelector('.btn'); b.textContent = T.startGame;
  b.addEventListener('click', () => { stamp(0); swapTo(() => game(true)); });
  desk.replaceChildren(n);
}

const BOSS_R = 62;   // boss photo radius

function game(autoStart) {
  $('foot').textContent = G.foot;
  const n = note('--note-d', -1);
  n.classList.add('game');
  n.innerHTML = `<span class="num" style="text-align:center;font-size:15px">${G.title}</span><div class="hud"><span>${G.score}: <b id="gScore">0</b></span><span>${G.lives}: <b id="gLives">${LIVES}</b></span></div>
    <div class="arena" id="arena" style="height:min(62vh,560px);touch-action:none"><canvas id="gc"></canvas><div class="over" id="over"></div></div>`;
  desk.replaceChildren(n);
  const arena = $('arena'), cv = $('gc'), ctx = cv.getContext('2d'), over = $('over');
  let W = 0, H = 0;
  const size = () => {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = arena.clientWidth; H = arena.clientHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  };
  size();

  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .3, v: 20 + Math.random() * 60 }));
  let st = 'idle', ship, pb, eb, foes, boss, parts, t, fireAcc, spawnAcc, lives, inv, score, phase, warnT, endT, last = 0;
  const keys = {};
  const rnd = (a, b) => a + Math.random() * (b - a);

  function reset() {
    ship = { x: W / 2, y: H - 60 };
    pb = []; eb = []; foes = []; parts = []; boss = null;
    t = 0; fireAcc = 0; spawnAcc = 0; lives = LIVES; inv = 0; score = 0; phase = 'waves'; warnT = 0; endT = 0;
    $('gScore').textContent = 0; $('gLives').textContent = lives;
  }
  relayout = () => { size(); if (ship) { ship.x = Math.min(ship.x, W - 16); ship.y = Math.min(ship.y, H - 20); } draw(); };

  function boom(x, y, count, colors) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = rnd(40, 220);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: rnd(.35, .8), r: rnd(2, 5), c: colors[i % colors.length] });
    }
  }
  function shoot(x, y, ang, sp, isBoss) { eb.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, boss: isBoss }); }
  function hitShip() {
    lives--; inv = 2.2; $('gLives').textContent = Math.max(0, lives);
    boom(ship.x, ship.y, 22, ['#ff5f9e', '#ffe27a', '#ffffff']);
    eb = eb.filter(b => Math.hypot(b.x - ship.x, b.y - ship.y) > 90);
    if (lives <= 0) { st = 'lost'; endT = 0; boom(ship.x, ship.y, 50, ['#ff5f9e', '#ffe27a', '#ffffff']); }
  }

  function update(dt) {
    t += dt;
    stars.forEach(s => { s.y += s.v * dt / H; if (s.y > 1) { s.y = 0; s.x = Math.random(); } });
    parts = parts.filter(p => { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .97; p.vy *= .97; return p.life < p.max; });
    if (st === 'won' || st === 'lost') { endT += dt; if (endT > 1.3) end(); eb.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; }); return; }

    // ship
    const kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    const ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
    ship.x += kx * 320 * dt; ship.y += ky * 320 * dt;
    ship.x = Math.max(16, Math.min(W - 16, ship.x)); ship.y = Math.max(30, Math.min(H - 22, ship.y));
    inv = Math.max(0, inv - dt);

    // auto fire
    fireAcc += dt;
    while (fireAcc > 0.13) { fireAcc -= 0.13; pb.push({ x: ship.x, y: ship.y - 18 }); }
    pb.forEach(b => b.y -= 560 * dt); pb = pb.filter(b => b.y > -20);

    // waves of small clouds, then the boss
    if (phase === 'waves') {
      spawnAcc += dt;
      const late = t > WAVES_SECONDS * 0.55, every = late ? 0.8 : 1.15;
      while (spawnAcc > every) {
        spawnAcc -= every;
        const bx = rnd(30, W - 30);
        foes.push({ bx, x: bx, y: -24, vy: rnd(60, 90) + (late ? 20 : 0), ph: rnd(0, 6), amp: late ? rnd(30, 70) : rnd(0, 25), hp: 2, cd: rnd(1.8, 3.4), flash: 0 });
      }
      if (t > WAVES_SECONDS) { phase = 'warn'; warnT = 0; }
    } else if (phase === 'warn') {
      warnT += dt;
      if (warnT > 3.4) { phase = 'boss'; boss = { x: W / 2, y: -100, hp: BOSS_HP, t: 0, cd: 1.6, n: 0, flash: 0 }; }
    }

    foes.forEach(f => {
      f.y += f.vy * dt; f.x = f.bx + Math.sin(t * 2 + f.ph) * f.amp; f.flash = Math.max(0, f.flash - dt);
      f.cd -= dt;
      if (f.cd <= 0 && f.y > 10 && f.y < H * 0.7) { f.cd = rnd(2.4, 4); shoot(f.x, f.y + 14, Math.atan2(ship.y - f.y, ship.x - f.x), 115); }
    });
    foes = foes.filter(f => f.y < H + 40 && f.hp > 0);

    if (boss) {
      boss.t += dt; boss.flash = Math.max(0, boss.flash - dt);
      boss.y += (90 - boss.y) * Math.min(1, dt * 1.5);
      boss.x = W / 2 + Math.sin(boss.t * 0.7) * Math.max(0, W / 2 - 80);
      const rage = boss.hp < BOSS_HP / 2;
      boss.cd -= dt;
      if (boss.cd <= 0 && boss.y > 60) {
        const k = boss.n++ % 3, ox = boss.x, oy = boss.y + BOSS_R - 6;
        if (k === 0) for (let i = -2; i <= 2; i++) shoot(ox, oy, Math.PI / 2 + i * 0.25, rage ? 150 : 125, true);
        if (k === 1) { const a = Math.atan2(ship.y - oy, ship.x - ox); for (const d of rage ? [-.2, 0, .2] : [0]) shoot(ox, oy, a + d, 165, true); }
        if (k === 2) { const m = rage ? 12 : 9, off = Math.random(); for (let i = 0; i < m; i++) shoot(ox, boss.y, (i + off) / m * Math.PI * 2, 105, true); }
        boss.cd = rage ? 1.4 : 1.9;
      }
    }

    eb.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
    eb = eb.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

    // hearts hitting clouds
    pb = pb.filter(b => {
      for (const f of foes) {
        if (f.hp > 0 && Math.hypot(b.x - f.x, b.y - f.y) < 20) {
          f.hp--; f.flash = .08;
          if (f.hp <= 0) { score += 10; $('gScore').textContent = score; boom(f.x, f.y, 14, ['#cfd3e0', '#ffffff', '#ff9ec4']); }
          return false;
        }
      }
      if (boss && boss.hp > 0 && Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_R + 4) {
        boss.hp--; boss.flash = .06; score += 1; $('gScore').textContent = score;
        if (boss.hp <= 0) {
          score += 500 + lives * 150; $('gScore').textContent = score;
          boom(boss.x, boss.y, 90, ['#cfd3e0', '#ffffff', '#ff9ec4', '#ffe27a']);
          eb = []; foes.forEach(f => boom(f.x, f.y, 8, ['#cfd3e0'])); foes = [];
          boss = null; st = 'won'; endT = 0; burst(140);
        }
        return false;
      }
      return true;
    });

    // things hitting the ship
    if (inv <= 0 && st === 'play') {
      if (eb.some(b => Math.hypot(b.x - ship.x, b.y - ship.y) < 7)) hitShip();
      else if (foes.some(f => Math.hypot(f.x - ship.x, f.y - ship.y) < 22)) hitShip();
      else if (boss && Math.hypot(ship.x - boss.x, ship.y - boss.y) < BOSS_R + 8) hitShip();
    }
  }

  // ---- drawing ----
  function cloud(x, y, s, fill, flash, rage) {
    const c = [[-.62, .12, .5], [0, -.22, .66], [.62, .12, .5], [0, .22, .58]];
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(4, s * .12);
    c.forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.stroke(); });
    ctx.fillStyle = flash ? '#ffffff' : fill;
    c.forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); });
    // grumpy face
    ctx.fillStyle = INK; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(2, s * .07);
    const ex = s * .26, ey = y + s * .05, er = Math.max(1.6, s * .07);
    ctx.beginPath(); ctx.arc(x - ex, ey, er, 0, 7); ctx.arc(x + ex, ey, er, 0, 7); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - ex - s * .14, ey - s * .2); ctx.lineTo(x - ex + s * .1, ey - s * .1);
    ctx.moveTo(x + ex + s * .14, ey - s * .2); ctx.lineTo(x + ex - s * .1, ey - s * .1);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x, ey + s * .32, s * .14, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    if (rage) { ctx.fillStyle = 'rgba(255,95,158,.55)'; ctx.beginPath(); ctx.ellipse(x - ex - s * .12, ey + s * .16, s * .1, s * .06, 0, 0, 7); ctx.ellipse(x + ex + s * .12, ey + s * .16, s * .1, s * .06, 0, 0, 7); ctx.fill(); }
  }
  function heartAt(x, y, s, col) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y + s * .3 - s / 2);
    ctx.bezierCurveTo(x, y - s / 2, x - s * .5, y - s / 2, x - s * .5, y + s * .3 - s / 2);
    ctx.bezierCurveTo(x - s * .5, y + s * .6 - s / 2, x, y + s * .8 - s / 2, x, y + s / 2);
    ctx.bezierCurveTo(x, y + s * .8 - s / 2, x + s * .5, y + s * .6 - s / 2, x + s * .5, y + s * .3 - s / 2);
    ctx.bezierCurveTo(x + s * .5, y - s / 2, x, y - s / 2, x, y + s * .3 - s / 2);
    ctx.fill();
  }
  function drawBoss() {
    const { x, y } = boss, r = BOSS_R, rage = boss.hp < BOSS_HP / 2;
    const wob = rage ? Math.sin(boss.t * 30) * 1.5 : 0;
    ctx.save();
    ctx.translate(x + wob, y);
    ctx.rotate(Math.sin(boss.t * 2) * 0.08);
    ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, 7); ctx.fillStyle = rage ? '#ff5f9e' : '#ffe27a'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
    if (BOSS_PHOTO.complete && BOSS_PHOTO.naturalWidth) ctx.drawImage(BOSS_PHOTO, -r, -r, r * 2, r * 2);
    else { ctx.fillStyle = '#aeb4c6'; ctx.fillRect(-r, -r, r * 2, r * 2); }
    if (rage) { ctx.fillStyle = 'rgba(255,60,90,.28)'; ctx.fillRect(-r, -r, r * 2, r * 2); }
    if (boss.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-r, -r, r * 2, r * 2); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }
  function drawShip() {
    if (inv > 0 && Math.floor(inv * 12) % 2) return;
    const { x, y } = ship;
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.moveTo(x - 5, y + 9); ctx.lineTo(x + 5, y + 9); ctx.lineTo(x, y + 18 + Math.random() * 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(x + 14, y + 11); ctx.lineTo(x, y + 5); ctx.lineTo(x - 14, y + 11); ctx.closePath();
    ctx.fillStyle = '#ff5f9e'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y - 4, 4.5, 0, 7); ctx.fillStyle = '#bfdcff'; ctx.fill(); ctx.stroke();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill(); });
    if (!ship) return;
    foes.forEach(f => cloud(f.x, f.y, 18, '#c9cede', f.flash > 0));
    if (boss) drawBoss();
    pb.forEach(b => heartAt(b.x, b.y, 10, '#ff9ec4'));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    eb.forEach(b => {
      ctx.font = `800 ${b.boss ? 26 : 20}px Nunito, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.strokeText('!', b.x, b.y);
      ctx.fillStyle = b.boss ? '#ff5f9e' : '#e8dcff'; ctx.fillText('!', b.x, b.y);
    });
    if (st !== 'lost' || endT === 0) { if (lives > 0) drawShip(); }
    parts.forEach(p => { ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (phase === 'warn' && Math.floor(warnT * 3) % 2 === 0) {
      ctx.font = '700 24px "Patrick Hand", "Noto Sans Georgian", sans-serif'; ctx.fillStyle = '#ffe27a'; G.warn.split('\n').forEach((ln, i, a) => ctx.fillText(ln, W / 2, H * .4 + (i - (a.length - 1) / 2) * 30));
    }
    if (boss) {
      const bw = W - 40, f = Math.max(0, boss.hp / BOSS_HP);
      ctx.font = '700 13px "Noto Sans Georgian", Nunito, sans-serif'; ctx.fillStyle = '#ffffff'; ctx.fillText(G.boss, W / 2, 14);
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(20, 24, bw, 9);
      ctx.fillStyle = f < .5 ? '#ff5f9e' : '#ffe27a'; ctx.fillRect(20, 24, bw * f, 9);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.strokeRect(20, 24, bw, 9);
    }
  }

  function loop(now) {
    if (!document.body.contains(arena)) return;
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    if (st === 'play' || st === 'won' || st === 'lost') requestAnimationFrame(loop);
  }

  // ---- menus ----
  function menu(html) { over.innerHTML = html; over.hidden = false; }
  function startMenu() {
    menu(`<h2></h2><p></p><button class="btn yes" type="button" id="gStart"></button>`);
    over.querySelector('h2').textContent = G.title;
    over.querySelector('p').textContent = G.rules;
    $('gStart').textContent = G.start;
    $('gStart').addEventListener('click', e => { e.stopPropagation(); begin(); });
  }
  function begin() {
    over.hidden = true; reset(); st = 'play';
    last = performance.now(); requestAnimationFrame(loop);
    arena.focus({ preventScroll: true });
  }
  function end() {
    const won = st === 'won';
    st = 'over';
    const best = getBest(), isNew = score > best;
    if (isNew) setBest(score);
    const againRow = `<div class="row"><button class="btn yes" type="button" id="gAgain"></button></div>`;
    const wireAgain = () => { $('gAgain').textContent = G.again; $('gAgain').addEventListener('click', e => { e.stopPropagation(); begin(); }); };
    if (won) {
      stamp(1);
      menu(`<h2></h2><p></p><div class="row"><button class="btn yes" type="button" id="aYes"></button><button class="btn" type="button" id="aNo"></button></div>`);
      over.querySelector('h2').textContent = T.ask;
      over.querySelector('p').textContent = G.wonText;
      $('aYes').textContent = T.yes; $('aNo').textContent = T.no;
      const answer = (text, happy) => e => {
        e.stopPropagation(); stamp(2);
        menu(`<h2></h2>${againRow}`);
        over.querySelector('h2').textContent = text; wireAgain();
        if (happy) burst(160);
      };
      $('aYes').addEventListener('click', answer(T.thanks, true));
      $('aNo').addEventListener('click', answer(T.later, false));
      return;
    }
    menu(`<h2></h2><p></p><p>${G.score}</p><div class="big">${score}</div><p></p>${againRow}`);
    over.querySelector('h2').textContent = G.lost;
    const ps = over.querySelectorAll('p');
    ps[0].textContent = G.lostText;
    ps[2].textContent = isNew ? G.newBest : `${G.best}: ${best}`;
    wireAgain();
  }

  // ---- controls: drag anywhere (relative, so the finger never hides the ship), or arrows / WASD ----
  let drag = null;
  arena.addEventListener('pointerdown', e => {
    if (e.target.closest('.over') || st !== 'play') return;
    e.preventDefault(); drag = { x: e.clientX, y: e.clientY };
    arena.setPointerCapture?.(e.pointerId);
  });
  arena.addEventListener('pointermove', e => {
    if (!drag || st !== 'play') return;
    ship.x += (e.clientX - drag.x) * 1.25; ship.y += (e.clientY - drag.y) * 1.25;
    drag = { x: e.clientX, y: e.clientY };
  });
  const endDrag = () => { drag = null; };
  arena.addEventListener('pointerup', endDrag); arena.addEventListener('pointercancel', endDrag);
  const onKey = e => {
    if (!document.body.contains(arena)) { removeEventListener('keydown', onKey); removeEventListener('keyup', onKey); return; }
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'a', 'd', 'w', 's'].includes(k)) {
      keys[k] = e.type === 'keydown';
      if (st === 'play') e.preventDefault();
    }
  };
  addEventListener('keydown', onKey); addEventListener('keyup', onKey);

  draw();
  if (autoStart) begin(); else startMenu();
}

// ---------- heart confetti ----------
const fx = $('fx'), fctx = fx.getContext('2d');
let parts = [], running = false;
function fxSize() { const d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
fxSize();
const HUES = ['#ff5f9e', '#ffe27a', '#b9ecd6', '#bfdcff', '#ffc2dc', '#ffffff'];
function heart(s) {
  fctx.beginPath(); fctx.moveTo(0, s * .3);
  fctx.bezierCurveTo(0, 0, -s * .5, 0, -s * .5, s * .3);
  fctx.bezierCurveTo(-s * .5, s * .6, 0, s * .8, 0, s);
  fctx.bezierCurveTo(0, s * .8, s * .5, s * .6, s * .5, s * .3);
  fctx.bezierCurveTo(s * .5, 0, 0, 0, 0, s * .3);
  fctx.fill(); fctx.strokeStyle = '#2f2346'; fctx.lineWidth = 1.5; fctx.stroke();
}
function burst(n) {
  if (REDUCED) n = Math.min(n, 20);
  for (let i = 0; i < n; i++) parts.push({
    x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .5,
    vx: (Math.random() - .5) * 13, vy: -5 - Math.random() * 10,
    s: 10 + Math.random() * 16, r: Math.random() * 6, vr: (Math.random() - .5) * .2,
    c: HUES[Math.random() * HUES.length | 0], life: 0,
  });
  if (!running) { running = true; requestAnimationFrame(step); }
}
function step() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
  for (const p of parts) {
    p.vy += 0.25; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; heart(p.s); fctx.restore();
  }
  if (parts.length) requestAnimationFrame(step); else { running = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}

addEventListener('resize', () => { fxSize(); if (relayout) relayout(); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(intro);
</script>
